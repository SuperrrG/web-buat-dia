<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Kamu ❤️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body {
      background: linear-gradient(135deg, #ffe6eb, #ffc2d1);
      min-height: 100vh; display: flex; justify-content: center;
      align-items: center; text-align: center; color: #590d22; padding: 20px;
    }
    .box { display: none; width: 100%; max-width: 600px; }
    .box.aktif { display: block; }
    .amplop {
      width: 200px; height: 130px; background: #ff4d6d; margin: 0 auto 20px;
      border-radius: 15px; display: flex; justify-content: center;
      align-items: center; font-size: 50px; cursor: pointer;
      box-shadow: 0 10px 25px rgba(255,77,109,0.4);
    }
    .kartu {
      background: white; padding: 30px 20px; border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h2 { color: #a4133c; margin-bottom: 15px; }
    .tombol-grup { margin-top: 25px; display: flex; justify-content: center; gap: 15px; }
    button {
      padding: 12px 24px; border: none; border-radius: 50px;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    #ya { background: #ff4d6d; color: white; }
    #gak { background: #ffe5ec; color: #800f2f; }
    .galeri { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
    .foto {
      background: white; padding: 12px 12px 20px; border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .foto img { width: 100%; height: 250px; object-fit: cover; border-radius: 6px; background: #ffe5ec; }
    .foto p { margin-top: 12px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="hal1" class="box aktif">
    <div class="amplop" onclick="keHal2()">💌</div>
    <h3>Ada pesan buat kamu, ketuk amplopnya! ✨</h3>
  </div>

  <div id="hal2" class="box">
    <div class="kartu">
      <h2>Sebelum buka fotonya... 🥺</h2>
      <p>Jawab jujur, kamu sayang aku gak?</p>
      <div class="tombol-grup">
        <button id="ya" onclick="keHal3()">Sayang Banget! ❤️</button>
        <button id="gak" onmouseover="lari()" onclick="lari()">Enggak 😜</button>
      </div>
    </div>
  </div>

  <div id="hal3" class="box">
    <h2>Yay! Aku Juga Sayang Kamu ❤️</h2>
    <div class="galeri">
      <div class="foto">
        <img src="foto1.jpg" alt="Foto 1">
        <p>Momen favorit kita ✨</p>
      </div>
      <div class="foto">
        <img src="foto2.jpg" alt="Foto 2">
        <p>Kamu manis banget di sini 🥰</p>
      </div>
      <div class="foto">
        <img src="foto3.jpg" alt="Foto 3">
        <p>Semoga terus bareng ya ❤️</p>
      </div>
    </div>
  </div>

  <script>
    function keHal2() {
      document.getElementById('hal1').classList.remove('aktif');
      document.getElementById('hal2').classList.add('aktif');
    }
    function lari() {
      const btn = document.getElementById('gak');
      btn.style.position = 'fixed';
      btn.style.left = Math.random() * 70 + 'vw';
      btn.style.top = Math.random() * 70 + 'vh';
    }
    function keHal3() {
      document.getElementById('hal2').classList.remove('aktif');
      document.getElementById('hal3').classList.add('aktif');
    }
  </script>
</body>
</html>
