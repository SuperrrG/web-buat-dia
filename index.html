<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Kamu ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body {
      background: linear-gradient(135deg, #ffe6eb, #ffc2d1);
      min-height: 100vh; display: flex; justify-content: center;
      align-items: center; text-align: center; color: #590d22;
      padding: 20px; overflow-x: hidden;
    }
    .box { display: none; width: 100%; max-width: 450px; animation: muncul 0.5s ease; }
    .box.aktif { display: block; }
    @keyframes muncul {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Tombol Musik Interaktif */
    #btnMusik {
      display: none; position: fixed; top: 18px; right: 18px;
      background: white; color: #a4133c; border: 2px solid #ff758f;
      padding: 8px 16px; border-radius: 50px; font-size: 14px;
      font-weight: bold; cursor: pointer; z-index: 100;
      box-shadow: 0 5px 15px rgba(255,77,109,0.25);
      transition: transform 0.2s;
    }
    #btnMusik.nyala {
      background: #ff4d6d; color: white; border-color: #ff4d6d;
      animation: denyutMusik 1.5s infinite;
    }
    @keyframes denyutMusik {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* Amplop */
    .amplop {
      width: 200px; height: 130px; background: #ff4d6d; margin: 0 auto 20px;
      border-radius: 15px; display: flex; justify-content: center;
      align-items: center; font-size: 55px; cursor: pointer;
      box-shadow: 0 10px 25px rgba(255,77,109,0.4);
      animation: goyang 2s infinite;
    }
    @keyframes goyang {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* Loading Lucu */
    .loading-icon {
      font-size: 60px; display: inline-block;
      animation: lompat 0.6s infinite alternate;
    }
    @keyframes lompat {
      from { transform: translateY(0); }
      to { transform: translateY(-18px); }
    }
    .loading-bar {
      width: 200px; height: 10px; background: rgba(255,255,255,0.6);
      border-radius: 10px; margin: 15px auto; overflow: hidden;
    }
    .loading-fill {
      height: 100%; width: 0%; background: #ff4d6d;
      animation: isiBar 1.4s ease forwards;
    }
    @keyframes isiBar { to { width: 100%; } }

    /* Kartu Pertanyaan */
    .kartu {
      background: white; padding: 30px 20px; border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h2 { color: #a4133c; margin-bottom: 12px; }
    .tombol-grup { margin-top: 25px; display: flex; justify-content: center; gap: 15px; }
    button {
      padding: 12px 22px; border: none; border-radius: 50px;
      font-size: 15px; font-weight: bold; cursor: pointer;
    }
    #ya { background: #ff4d6d; color: white; }
    #gak { background: #ffe5ec; color: #800f2f; }

    /* Galeri Geser */
    .slider-wrap {
      background: white; padding: 14px 14px 20px; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12); margin-top: 15px;
      touch-action: pan-y; user-select: none;
    }
    .slide { display: none; animation: muncul 0.4s ease; }
    .slide.aktif { display: block; }
    .slide img {
      width: 100%; height: 280px; object-fit: cover;
      border-radius: 10px; background: #ffe5ec;
    }
    .slide p { margin-top: 14px; font-weight: bold; font-size: 16px; }
    .nav-foto {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 16px; padding: 0 8px;
    }
    .btn-nav {
      background: #ffe5ec; color: #800f2f; padding: 8px 16px; font-size: 14px;
    }
    .btn-ulang {
      margin-top: 20px; background: transparent; color: #800f2f;
      text-decoration: underline; font-size: 14px;
    }
  </style>
</head>
<body>

  <audio id="audioLagu" src="musik.mp3" loop preload="auto"></audio>
  <button id="btnMusik" onclick="aturMusik()">🎵 Musik: ON</button>

  <div id="hal1" class="box aktif">
    <div class="amplop" onclick="loadingKe('hal2')">💌</div>
    <h3>Ada sesuatu buat kamu nih, coba ketuk amplopnya ✨</h3>
  </div>

  <div id="halLoading" class="box">
    <div class="loading-icon">🐰</div>
    <h3 style="margin-top: 10px;">Bentar ya, lagi nyiapin... ✨</h3>
    <div class="loading-bar"><div id="barFill" class="loading-fill"></div></div>
  </div>

  <div id="hal2" class="box">
    <div class="kartu">
      <h2>Sebentar, tes dulu... 👀</h2>
      <p>Kamu hari ini udah senyum belom?</p>
      <div class="tombol-grup">
        <button id="ya" onclick="loadingKe('hal3')">Udah dong 😊</button>
        <button id="gak" onmouseover="lari()" onclick="lari()">Belom, bete 😒</button>
      </div>
    </div>
  </div>

  <div id="hal3" class="box">
    <h2>Ini beberapa fotonya 📸</h2>
    <p style="font-size: 13px; margin-top: 4px;">(Geser fotonya atau klik tombol di bawah)</p>

    <div class="slider-wrap" id="areaGeser">
      <div class="slide aktif">
        <img src="foto1.jpg" alt="Foto 1">
        <p>Foto 1 ✨</p>
      </div>
      <div class="slide">
        <img src="foto2.jpg" alt="Foto 2">
        <p>Foto 2 😊</p>
      </div>
      <div class="slide">
        <img src="foto3.jpg" alt="Foto 3">
        <p>Foto 3 📸</p>
      </div>

      <div class="nav-foto">
        <button class="btn-nav" onclick="gantiFoto(-1)">⬅️ Kembali</button>
        <span id="indikator" style="font-weight: bold; font-size: 14px;">1 / 3</span>
        <button class="btn-nav" onclick="gantiFoto(1)">Lanjut ➡️</button>
      </div>
    </div>

    <button class="btn-ulang" onclick="ulangAwal()">↻ Ulang dari awal</button>
  </div>

  <script>
    let indeksFoto = 0;
    const daftarSlide = document.querySelectorAll('.slide');
    const audio = document.getElementById('audioLagu');
    const btnMusik = document.getElementById('btnMusik');

    function sembunyiSemua() {
      document.querySelectorAll('.box').forEach(b => b.classList.remove('aktif'));
    }

    function loadingKe(tujuan) {
      sembunyiSemua();
      const halLoad = document.getElementById('halLoading');
      const bar = document.getElementById('barFill');
      bar.style.animation = 'none';
      bar.offsetHeight;
      bar.style.animation = 'isiBar 1.4s ease forwards';
      halLoad.classList.add('aktif');

      setTimeout(() => {
        sembunyiSemua();
        document.getElementById(tujuan).classList.add('aktif');

        if (tujuan === 'hal3') {
          btnMusik.style.display = 'block';
          audio.play().then(() => {
            btnMusik.classList.add('nyala');
            btnMusik.innerText = '🎵 Musik: ON';
          }).catch(() => {
            btnMusik.classList.remove('nyala');
            btnMusik.innerText = '🔇 Musik: OFF';
          });
        }
      }, 1450);
    }

    function aturMusik() {
      if (audio.paused) {
        audio.play();
        btnMusik.classList.add('nyala');
        btnMusik.innerText = '🎵 Musik: ON';
      } else {
        audio.pause();
        btnMusik.classList.remove('nyala');
        btnMusik.innerText = '🔇 Musik: OFF';
      }
    }

    function lari() {
      const btn = document.getElementById('gak');
      btn.style.position = 'fixed';
      btn.style.left = Math.random() * 65 + 'vw';
      btn.style.top = Math.random() * 65 + 'vh';
    }

    function gantiFoto(arah) {
      daftarSlide[indeksFoto].classList.remove('aktif');
      indeksFoto = (indeksFoto + arah + daftarSlide.length) % daftarSlide.length;
      daftarSlide[indeksFoto].classList.add('aktif');
      document.getElementById('indikator').innerText = (indeksFoto + 1) + ' / ' + daftarSlide.length;
    }

    function ulangAwal() {
      audio.pause();
      audio.currentTime = 0;
      btnMusik.style.display = 'none';
      const btn = document.getElementById('gak');
      btn.style.position = 'static';
      sembunyiSemua();
      document.getElementById('hal1').classList.add('aktif');
    }

    let awalX = 0;
    const area = document.getElementById('areaGeser');
    area.addEventListener('touchstart', e => awalX = e.touches[0].clientX);
    area.addEventListener('touchend', e => {
      let selisih = awalX - e.changedTouches[0].clientX;
      if (selisih > 40) gantiFoto(1);
      if (selisih < -40) gantiFoto(-1);
    });
  </script>
</body>
</html>
